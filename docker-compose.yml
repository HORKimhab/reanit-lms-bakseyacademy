# Optional services. Not required if you run Postgres locally (e.g. Homebrew).
#   docker compose up -d db                        # Postgres only
#   docker compose --profile telegram up -d        # + self-hosted Telegram Bot API (see README)
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: reanit
      POSTGRES_PASSWORD: reanit
      POSTGRES_DB: reanit_lms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Self-hosted Bot API in --local mode: uploads up to 2000 MB, and getFile returns paths on its
  # disk, which the API reads through the same directory (TELEGRAM_LOCAL_DIR=<repo>/.telegram-bot-api).
  telegram-bot-api:
    profiles: ["telegram"]
    image: aiogram/telegram-bot-api:latest
    environment:
      # api_id / api_hash from https://my.telegram.org (required by this service only).
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./.telegram-bot-api:/var/lib/telegram-bot-api
    restart: unless-stopped

  # Bounds the local server's disk use: deletes cached copies not touched for TELEGRAM_CACHE_DAYS
  # (default 7). A pruned file is fetched from Telegram again on its next request.
  telegram-cache-prune:
    profiles: ["telegram"]
    image: alpine:3
    command: >
      sh -c 'while true; do
               find /data -type f -mtime +$${TELEGRAM_CACHE_DAYS:-7} -delete;
               sleep 3600;
             done'
    environment:
      TELEGRAM_CACHE_DAYS: ${TELEGRAM_CACHE_DAYS:-7}
    volumes:
      - ./.telegram-bot-api:/data
    restart: unless-stopped

volumes:
  pgdata:
